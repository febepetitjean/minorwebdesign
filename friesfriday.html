<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friesfriday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
  :root{--red:#EF2F4E;--yellow:#FFBF31}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--red)}
  #pile{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
  #pile .slot{position:absolute}
  #pile .b{position:absolute;background:var(--yellow)}

  /* Logo: an SVG on the 2576x1449 artboard, traced from the design */
  #logo{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible}
  #logo text{
    font-family:"Jost","Futura","Century Gothic","Avenir Next",sans-serif;
    font-style:italic;font-weight:800;font-size:273px;fill:var(--yellow);
    pointer-events:none;
  }
  #logo .lb{fill:var(--yellow);stroke:transparent;stroke-width:16px;pointer-events:all}
  #logo .hit{fill:transparent;pointer-events:all}
  #logo [data-snack]{cursor:none}   /* the snack name replaces the cursor */

  /* Snack-name cursor */
  #tip{
    position:fixed;left:0;top:0;z-index:10;pointer-events:none;
    padding:.4em .8em;border:3px solid var(--red);border-radius:999px;
    font:800 clamp(14px,1.7vw,28px)/1 "Jost","Futura","Century Gothic",sans-serif;
    letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;
    color:var(--red);background:var(--yellow);
    opacity:0;transition:opacity .08s;will-change:transform;
  }
  #tip.on{opacity:1}

  .replay{
    position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;
    font:700 14px/1 "Jost","Futura","Century Gothic",sans-serif;
    color:var(--yellow);background:transparent;border:2px solid var(--yellow);
    border-radius:999px;padding:10px 18px;cursor:pointer;
  }
  .replay:hover{background:var(--yellow);color:var(--red)}
  .replay:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
  <div id="pile" aria-hidden="true"></div>

  <svg id="logo" viewBox="0 0 2576 1449" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Friesfriday">
    <!-- visible letters -->
    <text x="481"  y="801" textLength="300" lengthAdjust="spacingAndGlyphs">FR</text>
    <text x="880"  y="801" textLength="596" lengthAdjust="spacingAndGlyphs">ESFR</text>
    <text x="1575" y="801" textLength="513" lengthAdjust="spacingAndGlyphs">DAY</text>

    <!-- invisible hover areas, one per letter -->
    <polygon class="hit" data-snack="Bicky Burger"   points="518,611 636,611 600,727 531,802 481,802"/>
    <polygon class="hit" data-snack="Viandel"        points="623,801 658,612 735,613 777,643 781,664 775,800"/>
    <polygon class="hit" data-snack="Kipcorn"        points="917,612 1034,612 1000,790 994,801 882,801"/>
    <polygon class="hit" data-snack="Kaaskroket"     points="1024,768 1054,649 1090,614 1124,609 1162,623 1175,642 1161,754 1133,793 1095,804 1065,800 1032,780"/>
    <polygon class="hit" data-snack="Frikandel"      points="1213,611 1331,611 1294,730 1226,802 1177,802 1205,652"/>
    <polygon class="hit" data-snack="Mexicano"       points="1317,800 1353,612 1431,613 1466,633 1476,668 1470,800 1468,801"/>
    <polygon class="hit" data-snack="Boulet"         points="1576,800 1612,612 1695,614 1736,636 1753,666 1756,700 1744,746 1712,782 1671,798 1646,801"/>
    <polygon class="hit" data-snack="Chickenfingers" points="1732,801 1779,726 1852,609 1879,610 1889,651 1922,792 1924,800"/>
    <polygon class="hit" data-snack="Loempia"        points="1928,612 2087,612 1996,799 1946,801"/>

    <!-- the two tall bars (the "I"s) -->
    <polygon class="lb" data-snack="Bitterballen" points="887,329 938,331 847,801 795,801"/>
    <polygon class="lb" data-snack="Bamischijf"   points="1582,329 1633,331 1542,801 1491,801"/>
  </svg>

  <div id="tip" aria-hidden="true"></div>
  <button class="replay" type="button">Replay</button>

<script>
(function(){
  var SKEW = -10.9;
  var LAYERS = 4, PITCH = 9.5, LAYER_STEP = 1.9, BASE = 2.4;   // in "u" (1u = 1% of logo width)
  var L = 18.3, T = 2;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var pile = document.getElementById("pile");
  var svg = document.getElementById("logo");
  var logoBars = svg.querySelectorAll(".lb");
  var running = [];
  function rnd(a, b){ return a + Math.random()*(b - a); }

  // Fall, bounce twice, settle exactly at 0 (the original position).
  function dropFrames(fromY, b, tf){
    return [
      {offset:0,   transform:tf(fromY), easing:"cubic-bezier(.55,0,.9,.6)"},
      {offset:.60, transform:tf(0),     easing:"cubic-bezier(.2,.7,.4,1)"},
      {offset:.76, transform:tf(-b),    easing:"cubic-bezier(.6,0,.9,.5)"},
      {offset:.88, transform:tf(0),     easing:"cubic-bezier(.2,.7,.4,1)"},
      {offset:.94, transform:tf(-b*.26),easing:"cubic-bezier(.6,0,.9,.5)"},
      {offset:1,   transform:tf(0)}
    ];
  }

  function play(){
    running.forEach(function(a){ a.cancel(); });
    running = [];
    pile.innerHTML = "";

    var W = window.innerWidth, H = window.innerHeight;
    var rect = svg.getBoundingClientRect();
    var s = Math.min(rect.width/2576, rect.height/1449);           // px per SVG unit
    var top0 = rect.top + (rect.height - 1449*s)/2;                // screen y of artboard top
    var u = s*25.76;                                               // px per "u"

    // 1) Logo bars: start fully above the screen, land back at translateY(0).
    if(!reduced){
      var from = -(top0 + 801*s)/s - 60;                           // in SVG units
      logoBars.forEach(function(el, k){
        running.push(el.animate(
          dropFrames(from, .035*H/s, function(y){ return "translateY("+y+"px)"; }),
          {duration:1500, delay:k*140, fill:"both"}
        ));
      });
    }

    // 2) Identical bars fall at the same time, settle nearly flat and crisscross.
    var perLayer = Math.ceil(W/(PITCH*u)) + 2;
    var n = 0;
    for(var r = 0; r < LAYERS; r++){
      for(var i = 0; i < perLayer; i++){
        var sign = ((i + r) % 2 === 0) ? 1 : -1;
        var tilt = sign * rnd(7, 17);
        var x = (i*PITCH + (r % 2 ? PITCH/2 : 0) - 8 + rnd(-1.2, 1.2))*u;
        var y = (BASE + r*LAYER_STEP + rnd(-.3, .3))*u;
        var endRot = "rotate("+(90 + tilt)+"deg) skewX("+SKEW+"deg)";

        var slot = document.createElement("div");
        slot.className = "slot";
        slot.style.cssText = "z-index:"+n+";left:"+x+"px;bottom:"+y+"px;width:"+(L*u)+"px;height:"+(T*u)+"px";
        var b = document.createElement("div");
        b.className = "b";
        b.style.cssText = "width:"+(T*u)+"px;height:"+(L*u)+"px;left:"+((L-T)/2*u)+"px;top:"+((T-L)/2*u)+"px;"+
                          "box-shadow:0 0 0 "+(.22*u)+"px #EF2F4E;transform:"+endRot;
        slot.appendChild(b);
        pile.appendChild(slot);

        if(!reduced){
          var delay = 80 + n*45 + rnd(0, 120);
          var dur = 1400 + rnd(0, 300);
          var start = "rotate("+rnd(-14,14).toFixed(1)+"deg) skewX("+SKEW+"deg)";
          running.push(slot.animate(
            dropFrames(-(H + L*u + r*40), .035*H, function(v){ return "translateY("+v+"px)"; }),
            {duration:dur, delay:delay, fill:"both"}
          ));
          running.push(b.animate([
            {offset:0,   transform:start},
            {offset:.30, transform:start, easing:"ease-in-out"},
            {offset:.60, transform:endRot},
            {offset:1,   transform:endRot}
          ],{duration:dur, delay:delay, fill:"both"}));
        }
        n++;
      }
    }
  }

  // ---- Snack-name cursor ----
  var tip = document.getElementById("tip");
  var hideTimer;
  function snackAt(el){ return el && el.getAttribute ? el.getAttribute("data-snack") : null; }
  function showTip(e){
    var name = snackAt(e.target);
    if(!name){ tip.classList.remove("on"); return; }
    if(tip.textContent !== name) tip.textContent = name;
    tip.style.transform = "translate("+e.clientX+"px,"+e.clientY+"px) translate(-50%,-50%)";
    tip.classList.add("on");
  }
  document.addEventListener("pointermove", showTip);
  document.addEventListener("pointerdown", function(e){          // touch screens: tap a letter
    showTip(e);
    if(e.pointerType === "touch"){
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function(){ tip.classList.remove("on"); }, 1400);
    }
  });
  document.documentElement.addEventListener("pointerleave", function(){ tip.classList.remove("on"); });

  document.querySelector(".replay").addEventListener("click", play);
  var t; window.addEventListener("resize", function(){ clearTimeout(t); t = setTimeout(play, 250); });
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(play);
})();
</script>
</body>
</html>
