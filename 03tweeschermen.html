<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestelling #3 — De Frietketel</title>

  <style>
    :root {
      --rood: #ee2f4e;
      --geel: #ffbd34;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--rood);
      font-family: Arial, Helvetica, sans-serif;
    }

    .pagina {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background: var(--rood);
    }

    /* Diagonale gele strook */
    .strook {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: var(--geel);
      clip-path: polygon(
        62.1% 0,
        98.1% 0,
        39.1% 100%,
        2.2% 100%
      );
      pointer-events: none;
    }

    /* Titel linksboven */
    .kop {
      position: absolute;
      z-index: 8;
      top: 7.8%;
      left: 4.3%;
      color: var(--geel);
    }

    .kop h1 {
      margin: 0 0 3px;
      font-size: clamp(27px, 3.6vw, 56px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .kop a {
      color: var(--geel);
      font-size: clamp(15px, 1.9vw, 29px);
      line-height: 1.2;
      font-weight: 900;
      text-decoration: none;
    }

    .kop a:hover {
      text-decoration: underline;
    }

    /* Terugknop bovenaan */
    .terug {
      position: absolute;
      z-index: 10;
      top: 20px;
      right: 28px;
      color: var(--geel);
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
    }

    .terug:hover {
      text-decoration: underline;
    }

    /* Klikbare linker- en rechterhelft */
    .klikzone {
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      width: 50%;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .klikzone.links {
      left: 0;
    }

    .klikzone.rechts {
      right: 0;
    }

    /* Woorden op de gele strook */
    .woord {
      position: absolute;
      z-index: 4;
      top: 50%;
      left: 50%;
      width: 90%;
      margin: 0;
      transform: translate(-50%, -50%);
      color: var(--rood);
      font-size: clamp(17px, 2vw, 30px);
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 1;
      transition: opacity 180ms ease;
    }

    .woord.verdwijn {
      opacity: 0;
    }

    /* Logo rechtsonder */
    .logo {
      position: absolute;
      z-index: 8;
      right: 2.5%;
      bottom: 5%;
      display: flex;
      align-items: center;
      gap: clamp(4px, 0.7vw, 11px);
      color: var(--geel);
      font-size: clamp(29px, 5.4vw, 86px);
      font-weight: 1000;
      font-style: italic;
      letter-spacing: -0.065em;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }

    .logo i {
      display: block;
      width: clamp(6px, 1vw, 16px);
      height: clamp(55px, 9.5vw, 150px);
      flex-shrink: 0;
      background: var(--geel);
      transform: skew(-12deg);
    }

    @media (max-width: 600px) {
      .kop {
        top: 8%;
        left: 4%;
      }

      .kop h1 {
        font-size: clamp(24px, 6vw, 36px);
      }

      .kop a {
        font-size: clamp(13px, 3.5vw, 20px);
      }

      .terug {
        top: 15px;
        right: 16px;
        font-size: 12px;
      }

      .woord {
        font-size: clamp(14px, 3.8vw, 22px);
      }

      .logo {
        right: 3%;
        bottom: 4%;
        gap: 4px;
        font-size: clamp(27px, 7vw, 42px);
      }

      .logo i {
        width: 6px;
        height: clamp(48px, 12vw, 70px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .woord {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="pagina">

    <!-- Gele diagonale strook -->
    <div class="strook" aria-hidden="true"></div>

    <!-- Titel en klikbare locatie -->
    <header class="kop">
      <h1>BESTELLING #3</h1>

      <a
        href="https://www.google.com/maps/place//data=!4m2!3m1!1s0x47c37169a8332305:0x2ffe68840c89c2a9?sa=X&ved=1t:8290&ictx=111"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="De Frietketel openen in Google Maps"
      >
        DE FRIETKETEL, GENT
      </a>
    </header>

    <!-- Terug naar de vorige pagina -->
    <a class="terug" href="javascript:history.back()">
      ← TERUG
    </a>

    <!-- Klik links voor het vorige woord -->
    <button
      class="klikzone links"
      id="vorige"
      type="button"
      aria-label="Vorig woord"
    ></button>

    <!-- Klik rechts voor het volgende woord -->
    <button
      class="klikzone rechts"
      id="volgende"
      type="button"
      aria-label="Volgend woord"
    ></button>

    <!-- De woorden verschijnen afzonderlijk -->
    <p class="woord" id="woord" aria-live="polite">
      TOMATENKETCHUP
    </p>

    <!-- Logo rechtsonder -->
    <div class="logo" aria-label="FRIESFRIDAY">
      <span>FR</span>
      <i></i>
      <span>ESFR</span>
      <i></i>
      <span>DAY</span>
    </div>

  </main>

  <script>
    const woorden = [
      "TOMATENKETCHUP",
      "VIANDEL",
      "CHICKENNUGGETS",
      "PUNTZAK"
    ];

    let huidigWoord = 0;

    const woordElement = document.getElementById("woord");
    const vorigeKnop = document.getElementById("vorige");
    const volgendeKnop = document.getElementById("volgende");

    function toonWoord(index) {
      huidigWoord = (index + woorden.length) % woorden.length;

      woordElement.classList.add("verdwijn");

      window.setTimeout(() => {
        woordElement.textContent = woorden[huidigWoord];
        woordElement.classList.remove("verdwijn");
      }, 180);
    }

    vorigeKnop.addEventListener("click", () => {
      toonWoord(huidigWoord - 1);
    });

    volgendeKnop.addEventListener("click", () => {
      toonWoord(huidigWoord + 1);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        toonWoord(huidigWoord - 1);
      }

      if (event.key === "ArrowRight") {
        toonWoord(huidigWoord + 1);
      }
    });
  </script>
</body>
</html>
