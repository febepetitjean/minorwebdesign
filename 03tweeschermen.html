<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIESFRIDAY — Bestelling #3</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --rood: #f3294b;
      --geel: #ffbd32;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: var(--rood);
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Gele diagonale strook */
    .strook {
      position: fixed;
      width: 40vw;
      height: 160vh;
      left: 50%;
      top: 50%;
      background: var(--geel);
      transform: translate(-50%, -50%) rotate(45deg);
      z-index: 0;
    }

    /* Terugknop */
    .terug {
      position: absolute;
      top: 35px;
      left: 4.3%;
      z-index: 5;
      color: var(--geel);
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .terug:hover {
      opacity: 0.65;
    }

    /* Titel linksboven */
    .titel {
      position: absolute;
      top: 85px;
      left: 4.3%;
      z-index: 2;
      color: var(--geel);
      text-transform: uppercase;
    }

    .titel h1 {
      font-size: clamp(28px, 3.5vw, 56px);
      font-weight: 900;
      line-height: 1;
    }

    .titel p {
      margin-top: 5px;
      font-size: clamp(16px, 1.8vw, 29px);
      font-weight: 900;
    }

    /* Woorden in het midden */
    .woorden {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 78%;
      gap: 35px;
      color: var(--rood);
      text-transform: uppercase;
      font-size: clamp(20px, 2vw, 32px);
      font-weight: 900;
      white-space: nowrap;
    }

    .woord {
      display: inline-block;
      animation: verschijnen 0.35s ease both;
    }

    @keyframes verschijnen {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Navigatiepijlen */
    .navigatie {
      position: absolute;
      left: 50%;
      bottom: 45px;
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      gap: 25px;
    }

    .pijl {
      width: 55px;
      height: 55px;
      border: 2px solid var(--geel);
      border-radius: 50%;
      background: transparent;
      color: var(--geel);
      font-size: 30px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .pijl:hover {
      background: var(--geel);
      color: var(--rood);
    }

    .pijl:disabled {
      opacity: 0.3;
      cursor: default;
    }

    /* Logo rechtsonder */
    .logo {
      position: absolute;
      right: 3%;
      bottom: 45px;
      z-index: 2;
      color: var(--geel);
      font-size: clamp(30px, 5.2vw, 82px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: -4px;
      text-transform: uppercase;
    }

    .logo span {
      display: inline-block;
      transform: skew(-8deg);
    }

    /* Aanpassing voor kleinere schermen */
    @media (max-width: 700px) {
      .strook {
        width: 65vw;
      }

      .titel {
        top: 100px;
      }

      .woorden {
        width: 90%;
        gap: 12px;
        flex-wrap: wrap;
        text-align: center;
        white-space: normal;
      }

      .logo {
        right: 5%;
        bottom: 125px;
        letter-spacing: -2px;
      }

      .navigatie {
        bottom: 35px;
      }
    }
  </style>
</head>

<body>

  <div class="strook"></div>

  <a class="terug" href="index.html">← Terug</a>

  <header class="titel">
    <h1>Bestelling #3</h1>
    <p>De Frietketel, Gent</p>
  </header>

  <main>
    <div class="woorden" id="woorden" aria-live="polite">
      <span class="woord">Tomatenketchup</span>
    </div>

    <nav class="navigatie" aria-label="Woordnavigatie">
      <button class="pijl" id="vorige" aria-label="Vorig woord">
        ←
      </button>
      <button class="pijl" id="volgende" aria-label="Volgend woord">
        →
      </button>
    </nav>
  </main>

  <div class="logo"><span>FR</span><span>IES</span><span>FR</span><span>IDAY</span></div>

  <script>
    const woorden = [
      "Tomatenketchup",
      "Viandel",
      "Chicken nuggets",
      "Puntzak"
    ];

    let huidigWoord = 0;

    const woordenContainer = document.getElementById("woorden");
    const vorigeKnop = document.getElementById("vorige");
    const volgendeKnop = document.getElementById("volgende");

    function toonWoord() {
      woordenContainer.innerHTML = "";

      const woord = document.createElement("span");
      woord.className = "woord";
      woord.textContent = woorden[huidigWoord];

      woordenContainer.appendChild(woord);

      vorigeKnop.disabled = huidigWoord === 0;
      volgendeKnop.disabled = huidigWoord === woorden.length - 1;
    }

    volgendeKnop.addEventListener("click", () => {
      if (huidigWoord < woorden.length - 1) {
        huidigWoord++;
        toonWoord();
      }
    });

    vorigeKnop.addEventListener("click", () => {
      if (huidigWoord > 0) {
        huidigWoord--;
        toonWoord();
      }
    });

    // Navigeren met de pijltjestoetsen
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" &&
          huidigWoord < woorden.length - 1) {
        huidigWoord++;
        toonWoord();
      }

      if (event.key === "ArrowLeft" && huidigWoord > 0) {
        huidigWoord--;
        toonWoord();
      }
    });

    toonWoord();
  </script>

</body>
</html>
