<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRIESFRIDAY — Bestelling #3</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    background: #f2294b;
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;

    /* Gebruik je originele ontwerp als achtergrond */
    background-image: url("WEBDESIGN-09%281%29.png");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* Gele strook: loopt schuin van boven tot onder */
  .yellow-stripe {
    position: absolute;
    inset: 0;
    background: #ffbd32;
    clip-path: polygon(
      62.3% 0,
      98.4% 0,
      39.3% 100%,
      2.4% 100%
    );
    z-index: 1;
    pointer-events: none;
  }

  /* Terugknop */
  .back-button {
    position: absolute;
    top: 28px;
    left: 30px;
    z-index: 5;

    border: none;
    background: #ffbd32;
    color: #f2294b;

    padding: 12px 20px;
    font-size: 16px;
    font-weight: 800;
    text-transform: uppercase;

    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .back-button:hover {
    background: #f2294b;
    color: #ffbd32;
    outline: 2px solid #ffbd32;
  }

  /* Het actieve woord */
  .word-container {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    z-index: 3;
    width: 90%;
    text-align: center;

    pointer-events: none;
  }

  .word {
    color: #f2294b;
    font-size: clamp(20px, 2.1vw, 32px);
    font-weight: 900;
    text-transform: uppercase;
    white-space: nowrap;

    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .word.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Klikzones links en rechts van de strook */
  .click-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 2;
    width: 50%;
    cursor: pointer;
    background: transparent;
    border: none;
  }

  .click-left {
    left: 0;
    clip-path: polygon(
      0 0,
      62.3% 0,
      2.4% 100%,
      0 100%
    );
  }

  .click-right {
    right: 0;
    clip-path: polygon(
      0 0,
      100% 0,
      100% 100%,
      39.3% 100%
    );
  }

  .click-zone:focus-visible {
    outline: 3px solid #ffbd32;
    outline-offset: -6px;
  }

  /* Kleine aanwijzing onderaan */
  .hint {
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 4;

    color: #ffbd32;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;

    pointer-events: none;
  }

  @media (max-width: 600px) {
    .back-button {
      top: 16px;
      left: 16px;
      padding: 10px 14px;
      font-size: 13px;
    }

    .word {
      font-size: clamp(16px, 4vw, 24px);
    }

    .hint {
      font-size: 9px;
      bottom: 14px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .word {
      transition: none;
    }
  }
</style>
</head>

<body>

<div class="page">

  <!-- Gele diagonale strook -->
  <div class="yellow-stripe"></div>

  <!-- Terug naar de vorige pagina -->
  <button class="back-button" onclick="goBack()">
    ← Terug
  </button>

  <!-- Klik links om terug te gaan -->
  <button
    class="click-zone click-left"
    aria-label="Vorig woord"
    onclick="changeWord(-1)">
  </button>

  <!-- Klik rechts om verder te gaan -->
  <button
    class="click-zone click-right"
    aria-label="Volgend woord"
    onclick="changeWord(1)">
  </button>

  <!-- Hier verschijnt telkens één woord -->
  <div class="word-container" aria-live="polite">
    <div class="word visible" id="activeWord">
      TOMATENKETCHUP
    </div>
  </div>

  <div class="hint">
    Klik links of rechts om verder te gaan
  </div>

</div>

<script>
  const words = [
    "TOMATENKETCHUP",
    "VIANDEL",
    "CHICKENNUGGETS",
    "PUNTZAK"
  ];

  let currentIndex = 0;

  const activeWord = document.getElementById("activeWord");

  function changeWord(direction) {
    const nextIndex = currentIndex + direction;

    // Stop aan het begin en einde van de lijst
    if (nextIndex < 0 || nextIndex >= words.length) {
      return;
    }

    currentIndex = nextIndex;

    // Verberg het huidige woord
    activeWord.classList.remove("visible");

    // Toon daarna het nieuwe woord
    setTimeout(() => {
      activeWord.textContent = words[currentIndex];
      activeWord.classList.add("visible");
    }, 150);
  }

  function goBack() {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      // Pas dit aan als je een vaste vorige pagina hebt
      window.location.href = "index.html";
    }
  }

  // Ondersteuning voor de pijltjestoetsen
  document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowRight") {
      changeWord(1);
    }

    if (event.key === "ArrowLeft") {
      changeWord(-1);
    }
  });
</script>

</body>
</html>
