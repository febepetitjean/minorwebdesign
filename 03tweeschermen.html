<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestelling #3 — Frietketel Gent</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --rood: #ee2f4e;
      --geel: #ffbd34;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--rood);
      color: var(--geel);
    }

    .pagina {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background-image: url("bestelling3.png");
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* De oorspronkelijke gele strook wordt opnieuw getekend
       zodat de woorden uit de afbeelding niet zichtbaar blijven. */
    .strook {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: var(--geel);
      clip-path: polygon(
        62.1% 0,
        98.1% 0,
        39.1% 100%,
        2.2% 100%
      );
      pointer-events: none;
    }

    /* Klikzones naast de gele strook */
    .klikzone {
      position: absolute;
      inset-block: 0;
      width: 50%;
      z-index: 2;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .klikzone.links {
      left: 0;
    }

    .klikzone.rechts {
      right: 0;
    }

    /* De woorden verschijnen één voor één op de strook */
    .woord {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 50%;
      width: 90%;
      transform: translate(-50%, -50%);
      margin: 0;
      color: var(--rood);
      font-size: clamp(17px, 2vw, 30px);
      line-height: 1.1;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0;
      transition: opacity 250ms ease;
    }

    .woord.zichtbaar {
      opacity: 1;
    }

    /* Navigatie bovenaan */
    .terug {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 10;
      color: var(--geel);
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
      padding: 8px 0;
    }

    .terug:hover {
      text-decoration: underline;
    }

    /* Klikbare link over de bestaande titel in de achtergrond */
    .maps-link {
      position: absolute;
      top: 13.5%;
      left: 3.5%;
      width: 25%;
      height: 5.5%;
      z-index: 8;
      display: block;
    }

    .maps-link:focus-visible,
    .terug:focus-visible,
    .klikzone:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    .hulp {
      position: absolute;
      z-index: 4;
      bottom: 3%;
      left: 50%;
      transform: translateX(-50%);
      color: var(--rood);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      transition: opacity 250ms ease;
      pointer-events: none;
    }

    .pagina:hover .hulp {
      opacity: 0.75;
    }

    @media (max-width: 600px) {
      .terug {
        top: 12px;
        left: 16px;
        font-size: 13px;
      }

      .woord {
        font-size: clamp(15px, 4vw, 23px);
      }

      .maps-link {
        top: 13%;
        left: 4%;
        width: 40%;
        height: 6%;
      }

      .hulp {
        font-size: 10px;
        bottom: 2%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .woord, .hulp {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="pagina" id="pagina" aria-label="Bestelling 3">

    <div class="strook" aria-hidden="true"></div>

    <a
      class="terug"
      href="javascript:history.back()"
      aria-label="Terug naar de vorige pagina"
    >← Terug</a>

    <a
      class="maps-link"
      href="https://www.google.com/maps/place//data=!4m2!3m1!1s0x47c37169a8332305:0x2ffe68840c89c2a9?sa=X&ved=1t:8290&ictx=111"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open Frietketel Gent in Google Maps"
      title="Open in Google Maps"
    ></a>

    <button
      class="klikzone links"
      id="vorige"
      type="button"
      aria-label="Toon het vorige woord"
    ></button>

    <button
      class="klikzone rechts"
      id="volgende"
      type="button"
      aria-label="Toon het volgende woord"
    ></button>

    <p class="woord zichtbaar" id="woord" aria-live="polite">
      TOMATENKETCHUP
    </p>

    <p class="hulp" aria-hidden="true">
      Klik links of rechts om te ontdekken
    </p>

  </main>

  <script>
    const woorden = [
      "PUNTZAK",
      "CHICKENNUGGETS",
      "VIANDEL",
      "TOMATENKETCHUP"
    ];

    let huidigWoord = 3;

    const woordElement = document.getElementById("woord");
    const vorigeKnop = document.getElementById("vorige");
    const volgendeKnop = document.getElementById("volgende");

    function toonWoord(index) {
      huidigWoord = (index + woorden.length) % woorden.length;

      woordElement.classList.remove("zichtbaar");

      window.setTimeout(() => {
        woordElement.textContent = woorden[huidigWoord];
        woordElement.classList.add("zichtbaar");
      }, 150);
    }

    vorigeKnop.addEventListener("click", () => {
      toonWoord(huidigWoord - 1);
    });

    volgendeKnop.addEventListener("click", () => {
      toonWoord(huidigWoord + 1);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        toonWoord(huidigWoord - 1);
      }

      if (event.key === "ArrowRight") {
        toonWoord(huidigWoord + 1);
      }
    });
  </script>
</body>
</html>
