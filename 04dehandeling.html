
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FRIES FRIDAY — SNACK RANKING</title>

<link href="https://fonts.googleapis.com/css2?family=Jost:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --pink: #EF2850;
  --yellow: #FFBE36;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background: var(--pink);
  color: var(--yellow);
  font-family: 'Jost', sans-serif;
  font-weight: 800;
}

button {
  font-family: inherit;
  cursor: pointer;
}

/* =========================
   HOOFDSCHERM
========================= */

#ranking {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 18% 1fr;
  column-gap: 12%;
  align-items: center;
  padding: 5vh 4vw 5vh 0;
}

/* CATEGORIEËN */

#tiers {
  display: flex;
  flex-direction: column;
  gap: clamp(13px, 2.4vh, 28px);
}

.tier {
  display: contents;
}

.tier-label {
  background: var(--yellow);
  color: var(--pink);
  border: none;

  width: 100%;
  height: clamp(55px, 7vh, 70px);

  font-size: clamp(18px, 2vw, 32px);
  font-weight: 900;

  text-align: center;
  transition: transform .2s ease;
}

.tier-label:hover {
  transform: translateX(8px);
}

/* RECHTERKANT */

#right-side {
  grid-column: 2;
  grid-row: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 20px;
}

/* LOSSE SNACKS */

#pool {
  display: flex;
  flex-wrap: wrap;
  align-content: center;
  align-items: center;
  gap: 0 9px;

  min-height: 180px;
  padding: 20px 0;
}

/* SNACKWOORDEN */

.snack {
  display: inline-block;
  color: var(--yellow);
  font-size: clamp(18px, 1.9vw, 31px);
  font-weight: 900;
  line-height: 1.25;

  cursor: grab;
  user-select: none;
  touch-action: none;
}

.snack:active {
  cursor: grabbing;
}

.snack.dragging {
  opacity: .25;
}

#pool .snack:not(:last-child)::after {
  content: ",";
}

/* GEPLAATSTE SNACKS */

.tier-items {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  align-content: center;
  gap: 6px 12px;

  min-height: 40px;
  padding: 8px;
}

.tier-items .snack {
  font-size: clamp(14px, 1.4vw, 22px);
}

/* HIGHLIGHT BIJ SLEPEN */

.drop-active {
  background: rgba(255,190,54,.14);
  outline: 2px dashed var(--yellow);
  border-radius: 8px;
}

/* RESET */

.reset {
  align-self: flex-start;
  background: transparent;
  color: var(--yellow);
  border: 2px solid var(--yellow);
  padding: 9px 18px;
  font-size: 13px;
  font-weight: 900;
}

.reset:hover {
  background: var(--yellow);
  color: var(--pink);
}

/* =========================
   PLATEAU PAGINA
========================= */

#plateau-page {
  display: none;
  min-height: 100vh;
  padding: 35px;
  text-align: center;
}

#plateau-page.active {
  display: block;
}

#ranking.hidden {
  display: none;
}

.back {
  position: absolute;
  top: 25px;
  left: 25px;

  background: var(--yellow);
  color: var(--pink);
  border: none;

  padding: 12px 26px;
  font-size: 18px;
  font-weight: 900;
}

.plateau-title {
  margin: 75px 0 0;
  font-size: clamp(55px, 9vw, 145px);
  line-height: 1;
  font-weight: 900;
}

.plateau-subtitle {
  margin: 12px 0 35px;
  font-size: clamp(16px, 2vw, 28px);
}

/* FRITUURPLATEAU */

.plateau {
  position: relative;

  width: min(88vw, 950px);
  min-height: 450px;

  margin: 20px auto;
  padding: 50px;

  display: flex;
  flex-wrap: wrap;
  align-items: center;
  align-content: center;
  justify-content: center;
  gap: 5px;

  background: #F5EEDF;

  border: 20px solid #E7E0D1;
  border-radius: 38px;

  box-shadow:
    inset 0 0 0 5px #D8D0C1,
    14px 18px 0 rgba(0,0,0,.15);

  transform: rotate(-1deg);
}

/* FOTO'S OP PLATEAU */

.plateau-snack {
  width: clamp(100px, 17vw, 190px);
  height: 145px;

  object-fit: contain;

  background: transparent;
  border: none;
  padding: 0;

  transform: rotate(var(--rotation));

  filter: drop-shadow(
    5px 9px 5px rgba(0,0,0,.22)
  );

  transition: transform .25s ease;
}

.plateau-snack:hover {
  transform:
    rotate(0deg)
    scale(1.15);
  z-index: 10;
}

/* TEKST ALS FOTO ONTBREEKT */

.snack-fallback {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 150px;
  min-height: 100px;

  padding: 15px;
  background: var(--yellow);
  color: var(--pink);

  border-radius: 12px;
  font-size: 18px;
  text-align: center;

  transform: rotate(var(--rotation));
}

.empty {
  color: var(--pink);
  font-size: 25px;
}

/* SLEEP-EFFECT */

.floating {
  position: fixed;
  z-index: 9999;
  pointer-events: none;

  padding: 9px 14px;
  border-radius: 5px;

  background: var(--yellow);
  color: var(--pink);

  font-size: 22px;
  font-weight: 900;
  white-space: nowrap;

  transform: translate(-50%, -50%);
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 800px) {

  #ranking {
    grid-template-columns: 135px 1fr;
    column-gap: 15px;
    padding-right: 15px;
  }

  .tier-label {
    font-size: 17px;
    height: 55px;
  }

  .snack {
    font-size: 18px;
  }

  .tier-items .snack {
    font-size: 15px;
  }

  .plateau {
    width: 100%;
    min-height: 330px;
    padding: 20px;
    border-width: 12px;
  }

  .plateau-snack {
    width: 110px;
    height: 100px;
  }

  #plateau-page {
    padding: 20px;
  }
}
</style>
</head>

<body>

<!-- =========================
     RANKING SCHERM
========================= -->

<main id="ranking">

  <div id="tiers"></div>

  <div id="right-side">

    <div id="pool" data-category="pool"></div>

    <button class="reset" id="reset">
      RESET RANKING
    </button>

  </div>

</main>

<!-- =========================
     PLATEAU SCHERM
========================= -->

<section id="plateau-page">

  <button class="back" id="back">
    ← TERUG
  </button>

  <h1 class="plateau-title" id="plateau-title">
    GODLIKE
  </h1>

  <p class="plateau-subtitle">
    JOUW FRITUURPLATEAU
  </p>

  <div class="plateau" id="plateau"></div>

</section>

<script>

/* =========================
   CATEGORIEËN
========================= */

const categories = [
  "GODLIKE",
  "VERY GOOD",
  "GOOD",
  "AVERAGE",
  "MEH",
  "BAD",
  "TRASH"
];

/* =========================
   ALLE SNACKS
========================= */

const snacks = [
  "curryworst",
  "curryworst speciaal",
  "frikandel",
  "viandel",
  "mexicano",
  "boulet",
  "boulet speciaal",
  "berepoot",
  "cervela",
  "kipcorn",
  "kipnuggets",
  "chicken fingers",
  "bitterballen",
  "kaaskroket",
  "garnaalkroket",
  "vleeskroket",
  "kaassoufflé",
  "mozzarellasticks",
  "loempia",
  "mini-loempia's",
  "Bicky Burger",
  "hamburger",
  "fishstick",
  "saté",
  "lucifers"
];

/* =========================
   OPSLAG
========================= */

const storageKey = "friesfriday-ranking-v2";

let ranking = {};

try {
  ranking =
    JSON.parse(localStorage.getItem(storageKey)) || {};
} catch {
  ranking = {};
}

function save() {
  localStorage.setItem(
    storageKey,
    JSON.stringify(ranking)
  );
}

/* =========================
   ELEMENTEN
========================= */

const tiers = document.getElementById("tiers");
const pool = document.getElementById("pool");

/* =========================
   SNACK MAKEN
========================= */

function createSnack(name) {

  const el = document.createElement("span");

  el.className = "snack";
  el.textContent = name;
  el.dataset.snack = name;

  el.addEventListener(
    "pointerdown",
    startDrag
  );

  return el;
}

/* =========================
   RENDEREN
========================= */

function render() {

  tiers.innerHTML = "";
  pool.innerHTML = "";

  categories.forEach(category => {

    const row = document.createElement("div");
    row.className = "tier";

    const label = document.createElement("button");
    label.className = "tier-label";
    label.textContent = category;

    label.onclick = () => openPlateau(category);

    const area = document.createElement("div");
    area.className = "tier-items";
    area.dataset.category = category;

    snacks
      .filter(name => ranking[name] === category)
      .forEach(name => {
        area.appendChild(createSnack(name));
      });

    row.appendChild(label);
    row.appendChild(area);

    tiers.appendChild(row);
  });

  snacks
    .filter(name => !categories.includes(ranking[name]))
    .forEach(name => {
      pool.appendChild(createSnack(name));
    });
}

/* =========================
   SNACK VERPLAATSEN
========================= */

function moveSnack(name, category) {

  if (category === "pool") {
    delete ranking[name];
  } else {
    ranking[name] = category;
  }

  save();
  render();
}

/* =========================
   DRAG & DROP
========================= */

let drag = null;

function startDrag(e) {

  if (e.button !== 0) return;

  const original = e.currentTarget;

  drag = {
    name: original.dataset.snack,
    original: original,
    startX: e.clientX,
    startY: e.clientY,
    moved: false,
    ghost: null
  };

  original.setPointerCapture(e.pointerId);

  original.addEventListener(
    "pointermove",
    onDrag
  );

  original.addEventListener(
    "pointerup",
    endDrag
  );

  original.addEventListener(
    "pointercancel",
    cancelDrag
  );
}

function onDrag(e) {

  if (!drag) return;

  const distance = Math.hypot(
    e.clientX - drag.startX,
    e.clientY - drag.startY
  );

  if (!drag.moved && distance < 6) return;

  if (!drag.moved) {

    drag.moved = true;

    drag.ghost = document.createElement("div");
    drag.ghost.className = "floating";
    drag.ghost.textContent = drag.name;

    document.body.appendChild(drag.ghost);

    drag.original.classList.add("dragging");
  }

  drag.ghost.style.left = e.clientX + "px";
  drag.ghost.style.top = e.clientY + "px";

  document
    .querySelectorAll(".drop-active")
    .forEach(el => {
      el.classList.remove("drop-active");
    });

  const target = document.elementFromPoint(
    e.clientX,
    e.clientY
  );

  const zone = target?.closest(
    ".tier-items, #pool, .tier-label"
  );

  if (zone) {
    zone.classList.add("drop-active");
  }
}

function cleanupDrag() {

  if (!drag) return;

  drag.original.classList.remove("dragging");
  drag.ghost?.remove();

  drag.original.removeEventListener(
    "pointermove",
    onDrag
  );

  drag.original.removeEventListener(
    "pointerup",
    endDrag
  );

  drag.original.removeEventListener(
    "pointercancel",
    cancelDrag
  );

  document
    .querySelectorAll(".drop-active")
    .forEach(el => {
      el.classList.remove("drop-active");
    });

  drag = null;
}

function endDrag(e) {

  if (!drag) return;

  const name = drag.name;
  const moved = drag.moved;

  const target = document.elementFromPoint(
    e.clientX,
    e.clientY
  );

  let zone = target?.closest(
    ".tier-items, #pool, .tier-label"
  );

  let category = null;

  if (zone) {

    if (zone.id === "pool") {
      category = "pool";
    }

    else if (zone.classList.contains("tier-items")) {
      category = zone.dataset.category;
    }

    else if (zone.classList.contains("tier-label")) {
      category = zone.textContent.trim();
    }
  }

  cleanupDrag();

  if (moved && category) {
    moveSnack(name, category);
  }
}

function cancelDrag() {
  cleanupDrag();
}

/* =========================
   FOTO'S VAN SNACKS
========================= */

function snackImagePath(name) {

  const filename = name
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/['’]/g, "")
    .replace(/\s+/g, "-");

  return "snacks/" + filename + ".png";
}

/* =========================
   PLATEAU OPENEN
========================= */

function openPlateau(category) {

  document
    .getElementById("ranking")
    .classList.add("hidden");

  document
    .getElementById("plateau-page")
    .classList.add("active");

  document
    .getElementById("plateau-title")
    .textContent = category;

  const plateau = document.getElementById("plateau");

  plateau.innerHTML = "";

  const selected = snacks.filter(
    name => ranking[name] === category
  );

  if (selected.length === 0) {

    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "Nog geen snacks op dit plateau!";

    plateau.appendChild(empty);

  } else {

    selected.forEach((name, index) => {

      const img = document.createElement("img");

      img.className = "plateau-snack";
      img.src = snackImagePath(name);
      img.alt = name;
      img.title = name;

      const rotation =
        ((index * 11) % 25) - 12;

      img.style.setProperty(
        "--rotation",
        rotation + "deg"
      );

      img.onerror = () => {

        const fallback = document.createElement("div");

        fallback.className = "snack-fallback";
        fallback.textContent = name;

        fallback.style.setProperty(
          "--rotation",
          rotation + "deg"
        );

        img.replaceWith(fallback);
      };

      plateau.appendChild(img);
    });
  }

  window.scrollTo(0, 0);
}

/* =========================
   TERUGKNOP
========================= */

document.getElementById("back").onclick = () => {

  document
    .getElementById("plateau-page")
    .classList.remove("active");

  document
    .getElementById("ranking")
    .classList.remove("hidden");
};

/* =========================
   RESET
========================= */

document.getElementById("reset").onclick = () => {

  if (confirm("Wil je jouw ranking opnieuw beginnen?")) {

    ranking = {};
    save();
    render();
  }
};

/* =========================
   START WEBSITE
========================= */

render();

</script>

</body>
</html>
