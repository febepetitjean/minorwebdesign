
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FRIES FRIDAY — TIERLIST</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --pink: #EF2850;
  --yellow: #FFBE36;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--pink);
  color: var(--yellow);
  font-family: 'Jost', sans-serif;
  font-weight: 800;
}

button {
  font-family: inherit;
  cursor: pointer;
}

/* =========================
   TERUGKNOP
========================= */

.back-home {
  position: absolute;
  top: 25px;
  left: 25px;
  z-index: 20;

  background: var(--yellow);
  color: var(--pink);
  border: none;

  padding: 10px 24px;
  font-size: 17px;
  font-weight: 900;

  text-decoration: none;
  transition: transform .2s;
}

.back-home:hover {
  transform: translateX(-5px);
}

/* =========================
   HOOFDSCHERM
========================= */

#ranking {
  min-height: 100vh;
  padding: 105px 4vw 55px 0;
}

/* ALLE CATEGORIEËN */

#tiers {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ELKE RIJ */

.tier {
  display: grid;
  grid-template-columns:
    clamp(150px, 19vw, 290px)
    minmax(0, 1fr);

  column-gap: clamp(20px, 5vw, 90px);
  align-items: center;

  min-height: 95px;
}

/* GELE CATEGORIEKNOP */

.tier-label {
  width: 100%;
  min-height: 65px;

  background: var(--yellow);
  color: var(--pink);

  border: none;

  font-size: clamp(19px, 2.1vw, 33px);
  font-weight: 900;
  text-align: center;

  transition: transform .2s ease;
}

.tier-label:hover {
  transform: translateX(8px);
}

/* FOTO'S IN DE CATEGORIE */

.tier-items {
  min-height: 95px;
  width: 100%;

  display: flex;
  flex-wrap: wrap;
  align-items: center;
  align-content: center;

  gap: 8px 15px;
  padding: 8px 12px;

  border-radius: 8px;
}

/* =========================
   FOTO'S VAN SNACKS
========================= */

.snack {
  display: block;

  width: clamp(80px, 8vw, 130px);
  height: clamp(70px, 8vw, 115px);

  object-fit: contain;

  cursor: grab;
  user-select: none;
  touch-action: none;
  -webkit-user-drag: none;

  filter: drop-shadow(
    4px 7px 4px rgba(0,0,0,.22)
  );

  transition: transform .2s ease;
}

.snack:hover {
  transform: scale(1.13) rotate(-4deg);
}

.snack:active {
  cursor: grabbing;
}

.snack.dragging {
  opacity: .25;
}

/* FOTO'S DIE AL IN EEN CATEGORIE STAAN */

.tier-items .snack {
  width: clamp(75px, 7vw, 110px);
  height: 85px;
}

/* =========================
   LOSSE SNACKS ONDERAAN
========================= */

#snack-section {
  margin:
    35px 5vw 0
    clamp(170px, 24vw, 380px);

  padding-top: 25px;
}

.snack-heading {
  font-size: clamp(20px, 2.5vw, 36px);
  margin: 0 0 15px;
  font-weight: 900;
}

#pool {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  align-content: center;

  gap: 15px 20px;

  min-height: 140px;
  padding: 20px 10px;

  border-radius: 8px;
}

/* =========================
   FALLBACK ALS FOTO ONTBREEKT
========================= */

.snack-placeholder {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  width: 120px;
  min-height: 75px;

  padding: 10px;

  background: var(--yellow);
  color: var(--pink);

  border-radius: 8px;

  font-size: 15px;
  line-height: 1.2;
  text-align: center;

  cursor: grab;
  user-select: none;
  touch-action: none;
}

.tier-items .snack-placeholder {
  width: 100px;
  min-height: 60px;
  font-size: 12px;
}

/* =========================
   DROP EFFECT
========================= */

.drop-active {
  background: rgba(255,190,54,.16);
  outline: 2px dashed var(--yellow);
  outline-offset: -2px;
  border-radius: 8px;
}

/* =========================
   RESETKNOP
========================= */

.reset {
  margin-top: 25px;

  background: transparent;
  color: var(--yellow);

  border: 2px solid var(--yellow);

  padding: 12px 22px;

  font-size: 15px;
  font-weight: 900;
}

.reset:hover {
  background: var(--yellow);
  color: var(--pink);
}

/* =========================
   PLATEAU PAGINA
========================= */

#plateau-page {
  display: none;

  min-height: 100vh;
  padding: 35px;

  text-align: center;
}

#plateau-page.active {
  display: block;
}

#ranking.hidden {
  display: none;
}

#home-button.hidden {
  display: none;
}

/* TERUG VAN PLATEAU */

.back-plateau {
  position: absolute;
  top: 25px;
  left: 25px;

  background: var(--yellow);
  color: var(--pink);

  border: none;

  padding: 10px 24px;

  font-size: 17px;
  font-weight: 900;
}

/* TITEL */

.plateau-title {
  margin: 75px 0 0;

  font-size: clamp(55px, 9vw, 145px);
  font-weight: 900;
  line-height: 1;
}

.plateau-subtitle {
  margin: 12px 0 35px;
  font-size: clamp(16px, 2vw, 28px);
}

/* =========================
   FRITUURPLATEAU
========================= */

.plateau {
  position: relative;

  width: min(88vw, 950px);
  min-height: 450px;

  margin: 20px auto;
  padding: 50px;

  display: flex;
  flex-wrap: wrap;
  align-items: center;
  align-content: center;
  justify-content: center;

  gap: 8px;

  background: #F5EEDF;

  border: 20px solid #E7E0D1;
  border-radius: 38px;

  box-shadow:
    inset 0 0 0 5px #D8D0C1,
    14px 18px 0 rgba(0,0,0,.15);

  transform: rotate(-1deg);
}

/* SNACKFOTO'S OP PLATEAU */

.plateau-snack {
  width: clamp(110px, 17vw, 195px);
  height: 150px;

  object-fit: contain;

  transform: rotate(var(--rotation));

  filter: drop-shadow(
    5px 9px 5px rgba(0,0,0,.22)
  );

  transition: transform .25s ease;
}

.plateau-snack:hover {
  transform: rotate(0deg) scale(1.15);
  z-index: 10;
}

/* FALLBACK OP PLATEAU */

.snack-fallback {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 150px;
  min-height: 100px;

  padding: 15px;

  background: var(--yellow);
  color: var(--pink);

  border-radius: 12px;

  font-size: 18px;
  text-align: center;

  transform: rotate(var(--rotation));
}

.empty {
  color: var(--pink);
  font-size: 25px;
}

/* =========================
   SLEEP-EFFECT
========================= */

.floating {
  position: fixed;
  z-index: 9999;

  pointer-events: none;

  width: 140px;
  height: 125px;

  object-fit: contain;

  transform: translate(-50%, -50%);

  filter: drop-shadow(
    5px 8px 5px rgba(0,0,0,.3)
  );
}

.floating-text {
  display: flex;
  align-items: center;
  justify-content: center;

  padding: 10px;

  background: var(--yellow);
  color: var(--pink);

  border-radius: 8px;

  font-size: 17px;
  text-align: center;
}

/* =========================
   MOBIEL
========================= */

@media (max-width: 800px) {

  #ranking {
    padding-top: 95px;
    padding-right: 12px;
  }

  .tier {
    grid-template-columns: 125px minmax(0, 1fr);
    column-gap: 12px;
    min-height: 85px;
  }

  .tier-label {
    min-height: 55px;
    font-size: 16px;
  }

  .tier-items {
    min-height: 75px;
    gap: 5px;
    padding: 5px;
  }

  .snack {
    width: 70px;
    height: 70px;
  }

  .tier-items .snack {
    width: 60px;
    height: 60px;
  }

  #snack-section {
    margin-left: 20px;
    margin-right: 10px;
  }

  #pool {
    gap: 8px;
  }

  .plateau {
    width: 100%;
    min-height: 330px;

    padding: 20px;
    border-width: 12px;
  }

  .plateau-snack {
    width: 110px;
    height: 100px;
  }

  #plateau-page {
    padding: 20px;
  }
}
</style>
</head>

<body>

<!-- =========================
     TERUG NAAR INDEX.HTML
========================= -->

<a href="index.html"
   class="back-home"
   id="home-button">
  ← TERUG
</a>

<!-- =========================
     TIERLIST
========================= -->

<main id="ranking">

  <div id="tiers"></div>

  <section id="snack-section">

    <h2 class="snack-heading">
      JOUW SNACKS
    </h2>

    <div id="pool" data-category="pool"></div>

    <button class="reset" id="reset">
      RESET RANKING
    </button>

  </section>

</main>

<!-- =========================
     PLATEAU SCHERM
========================= -->

<section id="plateau-page">

  <button class="back-plateau" id="back">
    ← TERUG
  </button>

  <h1 class="plateau-title" id="plateau-title">
    GODLIKE
  </h1>

  <p class="plateau-subtitle">
    JOUW FRITUURPLATEAU
  </p>

  <div class="plateau" id="plateau"></div>

</section>

<script>

/* =========================
   CATEGORIEËN
========================= */

const categories = [
  "GODLIKE",
  "VERY GOOD",
  "GOOD",
  "AVERAGE",
  "MEH",
  "BAD",
  "TRASH"
];

/* =========================
   SNACKS
========================= */

const snacks = [
  "curryworst",
  "curryworst speciaal",
  "frikandel",
  "viandel",
  "mexicano",
  "boulet",
  "boulet speciaal",
  "berepoot",
  "cervela",
  "kipcorn",
  "kipnuggets",
  "chicken fingers",
  "bitterballen",
  "kaaskroket",
  "garnaalkroket",
  "vleeskroket",
  "kaassoufflé",
  "mozzarellasticks",
  "loempia",
  "mini-loempia's",
  "Bicky Burger",
  "hamburger",
  "fishstick",
  "saté",
  "lucifers"
];

/* =========================
   FOTO BESTANDSNAMEN
========================= */

function snackImagePath(name) {

  const filename = name
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/['’]/g, "")
    .replace(/\s+/g, "-");

  return "snacks/" + filename + ".png";
}

/* =========================
   OPSLAG
========================= */

const storageKey = "friesfriday-ranking-v3";

let ranking = {};

try {
  ranking =
    JSON.parse(localStorage.getItem(storageKey)) || {};
} catch {
  ranking = {};
}

function save() {
  try {
    localStorage.setItem(
      storageKey,
      JSON.stringify(ranking)
    );
  } catch (error) {
    console.warn("Opslaan niet gelukt:", error);
  }
}

/* =========================
   ELEMENTEN
========================= */

const tiers = document.getElementById("tiers");
const pool = document.getElementById("pool");

/* =========================
   SNACKFOTO MAKEN
========================= */

function createSnack(name) {

  const img = document.createElement("img");

  img.className = "snack";
  img.src = snackImagePath(name);
  img.alt = name;
  img.title = name;
  img.dataset.snack = name;
  img.draggable = false;

  img.addEventListener("pointerdown", startDrag);

  img.onerror = () => {

    const fallback = document.createElement("div");

    fallback.className = "snack-placeholder";
    fallback.textContent = name;
    fallback.title = name;
    fallback.dataset.snack = name;

    fallback.addEventListener("pointerdown", startDrag);

    img.replaceWith(fallback);
  };

  return img;
}

/* =========================
   TIERLIST RENDEREN
========================= */

function render() {

  tiers.innerHTML = "";
  pool.innerHTML = "";

  categories.forEach(category => {

    const row = document.createElement("div");
    row.className = "tier";

    const label = document.createElement("button");

    label.className = "tier-label";
    label.textContent = category;

    label.onclick = () => openPlateau(category);

    const area = document.createElement("div");

    area.className = "tier-items";
    area.dataset.category = category;

    snacks
      .filter(name => ranking[name] === category)
      .forEach(name => {
        area.appendChild(createSnack(name));
      });

    row.appendChild(label);
    row.appendChild(area);

    tiers.appendChild(row);
  });

  snacks
    .filter(name => !categories.includes(ranking[name]))
    .forEach(name => {
      pool.appendChild(createSnack(name));
    });
}

/* =========================
   SNACK VERPLAATSEN
========================= */

function moveSnack(name, category) {

  if (category === "pool") {
    delete ranking[name];
  } else {
    ranking[name] = category;
  }

  save();
  render();
}

/* =========================
   DRAG & DROP
========================= */

let drag = null;

function startDrag(e) {

  if (e.button !== 0) return;

  e.preventDefault();

  const original = e.currentTarget;

  drag = {
    name: original.dataset.snack,
    original: original,
    startX: e.clientX,
    startY: e.clientY,
    moved: false,
    ghost: null
  };

  original.setPointerCapture(e.pointerId);

  original.addEventListener("pointermove", onDrag);
  original.addEventListener("pointerup", endDrag);
  original.addEventListener("pointercancel", cancelDrag);
}

function onDrag(e) {

  if (!drag) return;

  const distance = Math.hypot(
    e.clientX - drag.startX,
    e.clientY - drag.startY
  );

  if (!drag.moved && distance < 6) return;

  if (!drag.moved) {

    drag.moved = true;

    const ghost = document.createElement("img");

    ghost.className = "floating";
    ghost.src = snackImagePath(drag.name);
    ghost.alt = drag.name;

    ghost.onerror = () => {

      const fallback = document.createElement("div");

      fallback.className = "floating floating-text";
      fallback.textContent = drag.name;

      fallback.style.left = ghost.style.left;
      fallback.style.top = ghost.style.top;

      ghost.replaceWith(fallback);
      drag.ghost = fallback;
    };

    drag.ghost = ghost;

    document.body.appendChild(ghost);

    drag.original.classList.add("dragging");
  }

  drag.ghost.style.left = e.clientX + "px";
  drag.ghost.style.top = e.clientY + "px";

  document
    .querySelectorAll(".drop-active")
    .forEach(el => el.classList.remove("drop-active"));

  const target = document.elementFromPoint(
    e.clientX,
    e.clientY
  );

  const zone = target?.closest(
    ".tier-items, #pool, .tier-label"
  );

  if (zone) {
    zone.classList.add("drop-active");
  }
}

function cleanupDrag() {

  if (!drag) return;

  drag.original.classList.remove("dragging");
  drag.ghost?.remove();

  drag.original.removeEventListener("pointermove", onDrag);
  drag.original.removeEventListener("pointerup", endDrag);
  drag.original.removeEventListener("pointercancel", cancelDrag);

  document
    .querySelectorAll(".drop-active")
    .forEach(el => el.classList.remove("drop-active"));

  drag = null;
}

function endDrag(e) {

  if (!drag) return;

  const name = drag.name;
  const moved = drag.moved;

  const target = document.elementFromPoint(
    e.clientX,
    e.clientY
  );

  const zone = target?.closest(
    ".tier-items, #pool, .tier-label"
  );

  let category = null;

  if (zone) {

    if (zone.id === "pool") {
      category = "pool";
    }

    else if (zone.classList.contains("tier-items")) {
      category = zone.dataset.category;
    }

    else if (zone.classList.contains("tier-label")) {
      category = zone.textContent.trim();
    }
  }

  cleanupDrag();

  if (moved && category) {
    moveSnack(name, category);
  }
}

function cancelDrag() {
  cleanupDrag();
}

/* =========================
   PLATEAU OPENEN
========================= */

function openPlateau(category) {

  document
    .getElementById("ranking")
    .classList.add("hidden");

  document
    .getElementById("home-button")
    .classList.add("hidden");

  document
    .getElementById("plateau-page")
    .classList.add("active");

  document
    .getElementById("plateau-title")
    .textContent = category;

  const plateau = document.getElementById("plateau");

  plateau.innerHTML = "";

  const selected = snacks.filter(
    name => ranking[name] === category
  );

  if (selected.length === 0) {

    const empty = document.createElement("p");

    empty.className = "empty";
    empty.textContent = "Nog geen snacks op dit plateau!";

    plateau.appendChild(empty);

  } else {

    selected.forEach((name, index) => {

      const img = document.createElement("img");

      img.className = "plateau-snack";
      img.src = snackImagePath(name);
      img.alt = name;
      img.title = name;

      const rotation =
        ((index * 11) % 25) - 12;

      img.style.setProperty(
        "--rotation",
        rotation + "deg"
      );

      img.onerror = () => {

        const fallback = document.createElement("div");

        fallback.className = "snack-fallback";
        fallback.textContent = name;

        fallback.style.setProperty(
          "--rotation",
          rotation + "deg"
        );

        img.replaceWith(fallback);
      };

      plateau.appendChild(img);
    });
  }

  window.scrollTo(0, 0);
}

/* =========================
   TERUG NAAR TIERLIST
========================= */

document.getElementById("back").onclick = () => {

  document
    .getElementById("plateau-page")
    .classList.remove("active");

  document
    .getElementById("ranking")
    .classList.remove("hidden");

  document
    .getElementById("home-button")
    .classList.remove("hidden");
};

/* =========================
   RESET
========================= */

document.getElementById("reset").onclick = () => {

  if (confirm("Wil je jouw ranking opnieuw beginnen?")) {

    ranking = {};
    save();
    render();
  }
};

/* =========================
   START WEBSITE
========================= */

render();

</script>

</body>
</html>
