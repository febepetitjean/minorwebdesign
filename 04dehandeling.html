
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FRIES FRIDAY — TIERLIST</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --pink: #EF2850;
  --yellow: #FFBE36;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background: var(--pink);
  color: var(--yellow);
  font-family: 'Jost', sans-serif;
  font-weight: 800;
}

button {
  font-family: inherit;
  cursor: pointer;
}

/* TERUG NAAR INDEX */

.back-home,
.back-plateau {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 20;
  padding: 10px 23px;
  background: var(--yellow);
  color: var(--pink);
  border: none;
  font-size: 17px;
  font-weight: 900;
  text-decoration: none;
}

/* HOOFDSCHERM */

#ranking {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(155px, 22%) minmax(0, 1fr);
  column-gap: clamp(25px, 5vw, 90px);
  align-items: center;
  padding: 90px 4vw 35px 0;
}

/* CATEGORIEËN LINKS */

#tiers {
  display: flex;
  flex-direction: column;
  gap: clamp(9px, 1.5vh, 18px);
  min-width: 0;
}

.tier {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.tier-label {
  width: 100%;
  min-height: clamp(52px, 7vh, 70px);
  padding: 5px;
  background: var(--yellow);
  color: var(--pink);
  border: none;
  font-size: clamp(18px, 2vw, 31px);
  font-weight: 900;
  transition: transform .2s;
}

.tier-label:hover {
  transform: translateX(7px);
}

.tier-items {
  min-height: 25px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 3px 5px;
  border-radius: 7px;
}

/* SNACKS RECHTS */

#right-side {
  min-width: 0;
  width: 100%;
  align-self: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 15px;
}

#pool {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  align-items: center;
  justify-items: center;
  gap: clamp(5px, 1.2vh, 15px) 8px;
  width: 100%;
  min-height: 300px;
  padding: 10px;
  border-radius: 8px;
}

/* FOTO'S */

.snack {
  display: block;
  width: 100%;
  max-width: 125px;
  height: clamp(65px, 10vh, 105px);
  object-fit: contain;
  cursor: grab;
  user-select: none;
  touch-action: none;
  -webkit-user-drag: none;
  filter: drop-shadow(4px 6px 4px rgba(0,0,0,.22));
  transition: transform .2s;
}

.snack:hover {
  transform: scale(1.12) rotate(-4deg);
}

.snack.dragging {
  opacity: .25;
}

.tier-items .snack {
  width: 65px;
  height: 55px;
}

/* ALS EEN FOTO ONTBREEKT */

.snack-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 125px;
  min-height: 65px;
  padding: 8px;
  background: var(--yellow);
  color: var(--pink);
  border-radius: 7px;
  font-size: 13px;
  text-align: center;
  line-height: 1.2;
  cursor: grab;
  user-select: none;
  touch-action: none;
}

.tier-items .snack-placeholder {
  width: 75px;
  min-height: 45px;
  font-size: 10px;
}

.drop-active {
  background: rgba(255,190,54,.15);
  outline: 2px dashed var(--yellow);
  outline-offset: -2px;
}

/* RESET */

.reset {
  align-self: flex-start;
  background: transparent;
  color: var(--yellow);
  border: 2px solid var(--yellow);
  padding: 9px 18px;
  font-size: 13px;
  font-weight: 900;
}

.reset:hover {
  background: var(--yellow);
  color: var(--pink);
}

/* PLATEAU SCHERM */

#plateau-page {
  display: none;
  min-height: 100vh;
  padding: 35px;
  text-align: center;
}

#plateau-page.active {
  display: block;
}

#ranking.hidden,
#home-button.hidden {
  display: none;
}

.plateau-title {
  margin: 75px 0 0;
  font-size: clamp(55px, 9vw, 145px);
  font-weight: 900;
  line-height: 1;
}

.plateau-subtitle {
  margin: 12px 0 35px;
  font-size: clamp(16px, 2vw, 28px);
}

.plateau {
  width: min(88vw, 950px);
  min-height: 450px;
  margin: 20px auto;
  padding: 50px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  align-content: center;
  justify-content: center;
  gap: 8px;
  background: #F5EEDF;
  border: 20px solid #E7E0D1;
  border-radius: 38px;
  box-shadow:
    inset 0 0 0 5px #D8D0C1,
    14px 18px 0 rgba(0,0,0,.15);
  transform: rotate(-1deg);
}

.plateau-snack {
  width: clamp(110px, 17vw, 195px);
  height: 150px;
  object-fit: contain;
  transform: rotate(var(--rotation));
  filter: drop-shadow(5px 9px 5px rgba(0,0,0,.22));
  transition: transform .25s;
}

.plateau-snack:hover {
  transform: rotate(0deg) scale(1.15);
  z-index: 10;
}

.snack-fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 150px;
  min-height: 100px;
  padding: 15px;
  background: var(--yellow);
  color: var(--pink);
  border-radius: 12px;
  font-size: 18px;
  text-align: center;
  transform: rotate(var(--rotation));
}

.empty {
  color: var(--pink);
  font-size: 25px;
}

/* SLEEPFOTO */

.floating {
  position: fixed;
  z-index: 9999;
  pointer-events: none;
  width: 135px;
  height: 120px;
  object-fit: contain;
  transform: translate(-50%, -50%);
  filter: drop-shadow(5px 8px 5px rgba(0,0,0,.3));
}

.floating-text {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--yellow);
  color: var(--pink);
  border-radius: 8px;
  padding: 10px;
  font-size: 16px;
  text-align: center;
}

/* KLEINERE SCHERMEN */

@media (max-width: 800px) {
  #ranking {
    grid-template-columns: 125px minmax(0, 1fr);
    column-gap: 12px;
    padding: 85px 12px 25px 0;
  }

  .tier-label {
    font-size: 16px;
    min-height: 52px;
  }

  #pool {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 5px;
  }

  .snack {
    height: 70px;
  }

  .tier-items .snack {
    width: 48px;
    height: 45px;
  }

  .plateau {
    width: 100%;
    min-height: 330px;
    padding: 20px;
    border-width: 12px;
  }

  .plateau-snack {
    width: 110px;
    height: 100px;
  }
}

@media (max-width: 480px) {
  #pool {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .snack {
    height: 65px;
  }

  .tier-label {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<a href="index.html" class="back-home" id="home-button">
  ← TERUG
</a>

<main id="ranking">

  <div id="tiers"></div>

  <div id="right-side">
    <div id="pool" data-category="pool"></div>

    <button class="reset" id="reset">
      RESET RANKING
    </button>
  </div>

</main>

<section id="plateau-page">

  <button class="back-plateau" id="back">
    ← TERUG
  </button>

  <h1 class="plateau-title" id="plateau-title">
    GODLIKE
  </h1>

  <p class="plateau-subtitle">
    JOUW FRITUURPLATEAU
  </p>

  <div class="plateau" id="plateau"></div>

</section>

<script>

/* CATEGORIEËN */

const categories = [
  "GODLIKE",
  "VERY GOOD",
  "GOOD",
  "AVERAGE",
  "MEH",
  "BAD",
  "TRASH"
];

/* SNACKS */

const snacks = [
  "curryworst",
  "curryworst speciaal",
  "frikandel",
  "viandel",
  "mexicano",
  "boulet",
  "boulet speciaal",
  "berepoot",
  "cervela",
  "kipcorn",
  "kipnuggets",
  "chicken fingers",
  "bitterballen",
  "kaaskroket",
  "garnaalkroket",
  "vleeskroket",
  "kaassoufflé",
  "mozzarellasticks",
  "loempia",
  "mini-loempia's",
  "Bicky Burger",
  "hamburger",
  "fishstick",
  "saté",
  "lucifers"
];

/* FOTO BESTANDSNAMEN */

function snackImagePath(name) {
  const filename = name
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/['’]/g, "")
    .replace(/\s+/g, "-");

  return "snacks/" + filename + ".png";
}

/* OPSLAG */

const storageKey = "friesfriday-ranking-v3";

let ranking = {};

try {
  ranking = JSON.parse(localStorage.getItem(storageKey)) || {};
} catch {
  ranking = {};
}

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(ranking));
  } catch (error) {
    console.warn("Opslaan niet gelukt:", error);
  }
}

const tiers = document.getElementById("tiers");
const pool = document.getElementById("pool");

/* SNACKFOTO MAKEN */

function createSnack(name) {
  const img = document.createElement("img");

  img.className = "snack";
  img.src = snackImagePath(name);
  img.alt = name;
  img.title = name;
  img.dataset.snack = name;
  img.draggable = false;

  img.addEventListener("pointerdown", startDrag);

  img.onerror = () => {
    const fallback = document.createElement("div");
    fallback.className = "snack-placeholder";
    fallback.textContent = name;
    fallback.title = name;
    fallback.dataset.snack = name;
    fallback.addEventListener("pointerdown", startDrag);
    img.replaceWith(fallback);
  };

  return img;
}

/* RENDER */

function render() {
  tiers.innerHTML = "";
  pool.innerHTML = "";

  categories.forEach(category => {
    const row = document.createElement("div");
    row.className = "tier";

    const label = document.createElement("button");
    label.className = "tier-label";
    label.textContent = category;
    label.onclick = () => openPlateau(category);

    const area = document.createElement("div");
    area.className = "tier-items";
    area.dataset.category = category;

    snacks
      .filter(name => ranking[name] === category)
      .forEach(name => area.appendChild(createSnack(name)));

    row.append(label, area);
    tiers.appendChild(row);
  });

  snacks
    .filter(name => !categories.includes(ranking[name]))
    .forEach(name => pool.appendChild(createSnack(name)));
}

/* SNACK VERPLAATSEN */

function moveSnack(name, category) {
  if (category === "pool") {
    delete ranking[name];
  } else {
    ranking[name] = category;
  }

  save();
  render();
}

/* DRAG & DROP */

let drag = null;

function startDrag(e) {
  if (e.button !== 0) return;
  e.preventDefault();

  const original = e.currentTarget;

  drag = {
    name: original.dataset.snack,
    original,
    startX: e.clientX,
    startY: e.clientY,
    moved: false,
    ghost: null
  };

  original.setPointerCapture(e.pointerId);
  original.addEventListener("pointermove", onDrag);
  original.addEventListener("pointerup", endDrag);
  original.addEventListener("pointercancel", cancelDrag);
}

function onDrag(e) {
  if (!drag) return;

  const distance = Math.hypot(
    e.clientX - drag.startX,
    e.clientY - drag.startY
  );

  if (!drag.moved && distance < 6) return;

  if (!drag.moved) {
    drag.moved = true;

    const ghost = document.createElement("img");
    ghost.className = "floating";
    ghost.src = snackImagePath(drag.name);
    ghost.alt = drag.name;

    ghost.onerror = () => {
      const fallback = document.createElement("div");
      fallback.className = "floating floating-text";
      fallback.textContent = drag.name;
      fallback.style.left = ghost.style.left;
      fallback.style.top = ghost.style.top;
      ghost.replaceWith(fallback);
      drag.ghost = fallback;
    };

    drag.ghost = ghost;
    document.body.appendChild(ghost);
    drag.original.classList.add("dragging");
  }

  drag.ghost.style.left = e.clientX + "px";
  drag.ghost.style.top = e.clientY + "px";

  document.querySelectorAll(".drop-active").forEach(el => {
    el.classList.remove("drop-active");
  });

  const target = document.elementFromPoint(e.clientX, e.clientY);
  const zone = target?.closest(".tier-items, #pool, .tier-label");

  if (zone) zone.classList.add("drop-active");
}

function cleanupDrag() {
  if (!drag) return;

  drag.original.classList.remove("dragging");
  drag.ghost?.remove();

  drag.original.removeEventListener("pointermove", onDrag);
  drag.original.removeEventListener("pointerup", endDrag);
  drag.original.removeEventListener("pointercancel", cancelDrag);

  document.querySelectorAll(".drop-active").forEach(el => {
    el.classList.remove("drop-active");
  });

  drag = null;
}

function endDrag(e) {
  if (!drag) return;

  const name = drag.name;
  const moved = drag.moved;

  const target = document.elementFromPoint(e.clientX, e.clientY);
  const zone = target?.closest(".tier-items, #pool, .tier-label");

  let category = null;

  if (zone) {
    if (zone.id === "pool") {
      category = "pool";
    } else if (zone.classList.contains("tier-items")) {
      category = zone.dataset.category;
    } else if (zone.classList.contains("tier-label")) {
      category = zone.textContent.trim();
    }
  }

  cleanupDrag();

  if (moved && category) moveSnack(name, category);
}

function cancelDrag() {
  cleanupDrag();
}

/* PLATEAU */

function openPlateau(category) {
  document.getElementById("ranking").classList.add("hidden");
  document.getElementById("home-button").classList.add("hidden");
  document.getElementById("plateau-page").classList.add("active");
  document.getElementById("plateau-title").textContent = category;

  const plateau = document.getElementById("plateau");
  plateau.innerHTML = "";

  const selected = snacks.filter(name => ranking[name] === category);

  if (selected.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "Nog geen snacks op dit plateau!";
    plateau.appendChild(empty);
  } else {
    selected.forEach((name, index) => {
      const img = document.createElement("img");
      img.className = "plateau-snack";
      img.src = snackImagePath(name);
      img.alt = name;
      img.title = name;

      const rotation = ((index * 11) % 25) - 12;
      img.style.setProperty("--rotation", rotation + "deg");

      img.onerror = () => {
        const fallback = document.createElement("div");
        fallback.className = "snack-fallback";
        fallback.textContent = name;
        fallback.style.setProperty("--rotation", rotation + "deg");
        img.replaceWith(fallback);
      };

      plateau.appendChild(img);
    });
  }

  window.scrollTo(0, 0);
}

/* TERUG NAAR TIERLIST */

document.getElementById("back").onclick = () => {
  document.getElementById("plateau-page").classList.remove("active");
  document.getElementById("ranking").classList.remove("hidden");
  document.getElementById("home-button").classList.remove("hidden");
};

/* RESET */

document.getElementById("reset").onclick = () => {
  if (confirm("Wil je jouw ranking opnieuw beginnen?")) {
    ranking = {};
    save();
    render();
  }
};

/* START */

render();

</script>
</body>
</html>
