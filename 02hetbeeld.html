<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Fries Friday - Het beeld</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #e9b62e;
      cursor: crosshair;
    }

    .gallery {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .gallery img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    .gallery img.active {
      opacity: 1;
    }

    @media (max-width: 768px) {
      .gallery img {
        object-fit: cover;
      }
    }
  </style>
</head>

<body>

  <main class="gallery" id="gallery">

    <img
      src="CHAPELUUR, GENT.png"
      class="active"
      alt="Chapeluur Gent"
    >

    <img
      src="JOEY, GENT.png"
      alt="Joey Gent"
    >

    <img
      src="MANHATTENS, LEUVEN.png"
      alt="Manhattens Leuven"
    >

    <img
      src="SPOOR 33, LINTER.png"
      alt="Spoor 33 Linter"
    >

  </main>

  <script>
    const gallery = document.getElementById("gallery");
    const images = gallery.querySelectorAll("img");

    let currentIndex = 0;
    let lastX = null;
    let lastY = null;
    let distance = 0;

    const changeDistance = 130;

    function showImage(index) {
      images[currentIndex].classList.remove("active");

      currentIndex = index % images.length;

      images[currentIndex].classList.add("active");
    }

    gallery.addEventListener("pointermove", (event) => {

      if (event.pointerType === "touch") return;

      if (lastX === null) {
        lastX = event.clientX;
        lastY = event.clientY;
        return;
      }

      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;

      distance += Math.sqrt(dx * dx + dy * dy);

      lastX = event.clientX;
      lastY = event.clientY;

      if (distance >= changeDistance) {
        showImage(currentIndex + 1);
        distance = 0;
      }
    });

    gallery.addEventListener("pointerleave", () => {
      lastX = null;
      lastY = null;
      distance = 0;
    });

    // Op smartphone: tik om te wisselen
    gallery.addEventListener("click", () => {
      showImage(currentIndex + 1);
    });
  </script>

</body>
</html>
